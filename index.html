["bpos","bunc","bneg"].forEach(function(x){document.getElementById(x).classList.remove("s")});
[1,2,3,4,5].forEach(function(x){document.getElementById("c"+x).classList.remove("s")});
var s=L[c.blind_id]||{};
if(s.label){var m={"positive":"bpos","uncertain":"bunc","negative":"bneg"};if(m[s.label])document.getElementById(m[s.label]).classList.add("s")}
if(s.confidence)document.getElementById("c"+s.confidence).classList.add("s");
up()}
function sl(l){var c=D[cur];if(!L[c.blind_id])L[c.blind_id]={};L[c.blind_id].label=l;sv();r()}
function sc(n){var c=D[cur];if(!L[c.blind_id])L[c.blind_id]={};L[c.blind_id].confidence=n;sv();r();if(L[c.blind_id].label&&L[c.blind_id].confidence)setTimeout(function(){go(1)},300)}
function go(d){cur=Math.max(0,Math.min(D.length-1,cur+d));r();window.scrollTo(0,0)}
function sv(){localStorage.setItem("gtfvl",JSON.stringify(L))}
function up(){var dn=0;Object.keys(L).forEach(function(k){if(L[k].label&&L[k].confidence)dn++});document.getElementById("dc2").textContent=dn;document.getElementById("pf").style.width=(dn/D.length*100)+"%"}
function exp(){var csv="blind_id,target_vibe,label,confidence\n";D.forEach(function(c){var s=L[c.blind_id]||{};csv+=c.blind_id+","+c.target_vibe+","+(s.label||"")+","+(s.confidence||"")+"\n"});var b=new Blob([csv],{type:"text/csv"});var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download="GTF_Vibe_Labels_Atiqa.csv";a.click()}
document.addEventListener("keydown",function(e){if(e.key==="1")sl("positive");if(e.key==="2")sl("uncertain");if(e.key==="3")sl("negative");if(e.key==="q")sc(1);if(e.key==="w")sc(2);if(e.key==="e")sc(3);if(e.key==="r")sc(4);if(e.key==="t")sc(5);if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1)});
r();
</script></body></html>
